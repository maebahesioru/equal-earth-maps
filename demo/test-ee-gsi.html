<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"><title>GSI slippy repro</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>html,body{margin:0;height:100%;background:#000;}#map{position:absolute;inset:0;background:#dbe7f0;}</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="../shared/math.js"></script>
<script src="../shared/glsl.js"></script>
<script src="../shared/engine.js"></script>
<script src="../shared/sites.js"></script>
<script src="../shared/sources.js"></script>
<script src="../shared/eeslippy.js"></script>
<script>
(function () {
  const mapEl = document.getElementById('map');
  const map = L.map(mapEl, { zoomControl: false, attributionControl: false });
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
  map.setView([35.68, 139.69], 6);
  window.__ready = false;
  setTimeout(() => {
    const ov = new EEOverlay(mapEl, { maxDim: 4096 });
    const slip = new EESlippy(mapEl, ov, () => 'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18 });
    slip.attach();
    window.__slip = slip; window.__ov = ov;
    window.__ready = true;
  }, 1000);
})();
</script>
</body>
</html>
