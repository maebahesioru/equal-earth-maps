<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EE pipeline grid test</title>
<style>html,body{margin:0;background:#000;} #map{position:relative;width:1200px;height:600px;}</style>
</head>
<body>
<div id="map"></div>
<script src="../shared/math.js"></script>
<script src="../shared/glsl.js"></script>
<script src="../shared/engine.js"></script>
<script>
(function () {
  const pane = document.getElementById('map');
  const ov = new EEOverlay(pane, { maxDim: 2048 });
  ov.layout();
  const W = ov.canvas.width, H = ov.canvas.height;

  // ソース=疑似"世界窓"インデックステクスチャ (R=lon, G=lat)
  // pane行範囲を世界窓(worldWindow相当)で定義
  const a = H / W;
  const vis = Math.min(1, a);
  const rowTop = 0.5 - vis / 2, rowBot = 0.5 + vis / 2;
  const win = {
    lonL: -180, lonR: 180,
    latTop: EEMath.latFromRowFrac(rowTop),
    latBot: EEMath.latFromRowFrac(rowBot)
  };
  const idx = document.createElement('canvas');
  idx.width = W; idx.height = H;
  const ictx = idx.getContext('2d');
  const img = ictx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const row = rowTop + (y / H) * (rowBot - rowTop);
    const lat = EEMath.latFromRowFrac(row);
    for (let x = 0; x < W; x++) {
      const lon = -180 + (x / W) * 360;
      const i = (y * W + x) * 4;
      img.data[i] = Math.round((lon + 180) / 360 * 255);
      img.data[i + 1] = Math.round((lat + 90) / 180 * 255);
      img.data[i + 2] = 128;
      img.data[i + 3] = 255;
    }
  }
  ictx.putImageData(img, 0, 0);

  ov.setSourceCanvas(idx, { x: 0, y: 0, w: W, h: H });
  ov.setWindow(win);
  ov.setEnabled(true);
  window.__t = { ov, win };
})();
</script>
</body>
</html>
